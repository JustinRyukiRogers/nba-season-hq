<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Season HQ</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>
<header class="bar">
  <div class="bar-main">
    <div class="title" id="title">Season HQ</div>
    <button class="fresh" id="fresh" type="button" title="Data status: click for details" hidden><span class="fresh-dot"></span><span class="fresh-text"></span></button>
  </div>
  <nav class="tabs" id="tabs" role="tablist" hidden>
    <button data-tab="home" role="tab">Dashboard</button>
    <button data-tab="team" role="tab">My team</button>
    <button data-tab="week" role="tab">This week</button>
    <button data-tab="players" role="tab">Players</button>
    <button data-tab="trades" role="tab">Trades</button>
    <button data-tab="league" role="tab">League</button>
  </nav>
</header>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<main id="main">
  <section class="lock" id="lock" hidden>
    <form id="lock-form" autocomplete="off">
      <h1>Season HQ</h1>
      <p>The data on this page is encrypted. Enter the passphrase to open it.</p>
      <input id="lock-input" type="password" placeholder="Passphrase" autocapitalize="off" spellcheck="false" required>
      <label class="check"><input type="checkbox" id="lock-remember" checked> Remember on this device</label>
      <button class="primary" type="submit">Open</button>
      <p class="error" id="lock-error" hidden></p>
    </form>
  </section>
  <div id="view"></div>
</main>

<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div class="scrim" id="scrim" hidden></div>
<script src="crypto.js"></script>
<script src="charts.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
